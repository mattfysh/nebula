<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Work plan · Successor</title><link rel="stylesheet" href="/plan.css"><script src="/plan.js" defer></script></head>
<body>
<section id="login" class="login"><div class="mark">S</div><h1>Work plan</h1><p>Sign in to open the experimental planner.</p><form id="login-form"><label>Access token<input id="token" type="password" required autocomplete="current-password"></label><button>Sign in</button></form></section>
<main id="app" hidden>
<header class="topbar"><a href="/" class="brand"><span class="mark">S</span><span>Successor</span></a><nav><a href="/">Chat</a><a href="/plan" aria-current="page">Work plan <small>LAB</small></a></nav><button id="add" class="primary">＋ Add item</button></header>
<section class="hero"><div><p class="eyebrow">WORK GRAPH EXPERIMENT</p><h1>Plan the work, not just the list.</h1><p class="lede">Move between outcomes and next actions without duplicating context.</p></div><div id="stats" class="stats"></div></section>
<section class="toolbar"><div class="tabs"><button data-view="map" aria-pressed="true">Map</button><button data-view="focus">Goals</button><button data-view="alignment">Alignment</button><button data-view="done">Completed</button></div><label class="search"><span>⌕</span><input id="search" type="search" placeholder="Filter work…"></label></section>
<section id="content" class="content"><div id="list"></div><aside id="detail" hidden></aside></section>
</main>
<dialog id="editor"><form id="form"><header><div><p class="eyebrow">WORK ITEM</p><h2 id="form-heading">Add to plan</h2></div><button type="button" id="close" class="icon" aria-label="Close">×</button></header><label>Title<input id="title" maxlength="200" required placeholder="A clear outcome or next action"></label><label>Belongs under<select id="parent"><option value="">Top level outcome</option></select></label><label>Dependencies <small>These must happen first</small><select id="dependencies" multiple size="4"></select></label><label>Related work <small>Bidirectional context link</small><select id="links" multiple size="4"></select></label><label>Description<textarea id="description" rows="4" maxlength="16000" placeholder="What does done look like?"></textarea></label><label>Notes<textarea id="notes" rows="4" maxlength="16000" placeholder="Context, links, decisions…"></textarea></label><footer><button id="delete" type="button" class="danger" hidden>Delete</button><span></span><button type="button" id="cancel">Cancel</button><button class="primary">Save item</button></footer></form></dialog>
<p id="notice" role="alert"></p>
</body></html>
